# 一键启动：docker compose up --build
#
# 首次启动会自动：生成示例文档 → 下载嵌入模型 → 构建向量索引（耗时较长）。
# 之后数据保存在命名卷 rag_data 中，重启不会重复构建。
services:
  rag:
    build: .
    container_name: enterprise-rag
    ports:
      - "8001:8001"
    env_file:
      # 把 .env.example 复制为 backend/.env 并填写真实 LLM_API_KEY
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - rag_data:/app/data
    restart: unless-stopped

volumes:
  rag_data:
